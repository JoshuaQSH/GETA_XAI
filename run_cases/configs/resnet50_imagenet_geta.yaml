# ResNet50 ImageNet GETA Experiment Configuration
# ===============================================
# ResNet50 ImageNet with GETA optimizer for joint pruning and quantization

# Dataset Configuration
dataset:
  root: '../datasets'
  batch_size: 8
  num_workers: 4

# Training Configuration
training:
  epochs: 120
  lr: 1.0e-3  # Adam learning rate (lower for stability)
  lr_quant: 1.0e-3
  weight_decay: 1.0e-4
  lr_step_size: 30
  lr_gamma: 0.1

# GETA/Quantization Configuration
geta:
  target_sparsity: 0.4
  bit_reduction: 2
  min_bit: 4
  max_bit: 16
  exponential_t: 1.0

# Stage Configuration (in epochs)
stages:
  start_projection_step: 0
  projection_periods: 5
  projection_epochs: 5
  pruning_periods: 10
  pruning_epochs: 10

# Device Configuration
device: 'cuda:1'

# Output Configuration
output:
  dir: './outputs'
  experiment_name: ''  # Auto-generated if empty