# Default XAI-GETA Experiment Configuration
# ==========================================
# VGG7 CIFAR-10 with XAI-GETA optimizer using attribution-based importance scoring

# Dataset Configuration
dataset:
  root: '../datasets'
  batch_size: 64
  num_workers: 4

# Training Configuration
training:
  epochs: 200
  lr: 1.0e-3
  lr_quant: 1.0e-3
  weight_decay: 1.0e-4
  lr_step_size: 50
  lr_gamma: 0.1

# GETA/Quantization Configuration
geta:
  target_sparsity: 0.7
  bit_reduction: 2
  min_bit: 4
  max_bit: 16
  exponential_t: 1.0

# Stage Configuration (in epochs)
stages:
  start_projection_step: 0
  projection_periods: 5
  projection_epochs: 20
  pruning_periods: 10
  pruning_epochs: 30

# XAI-GETA Specific Configuration
xai:
  # Attribution method: saliency, input_x_gradient, layer_conductance,
  #   layer_gradient_x_activation, layer_integrated_gradients, deep_lift,
  #   integrated_gradients, lrp, layer_lrp, gradient_shap
  attribution_method: 'saliency'  # Conservative default for VGG reruns
  attribution_weight: 0.1  # Start low; VGG saliency proved sensitive at higher weights
  attribution_freq: 100    # Frequency of attribution updates (steps)
  attribution_n_steps: 5   # Number of steps for integrated gradients methods
  ema_decay: 0.9           # EMA decay for attribution smoothing
  num_samples: 10          # Number of samples for attribution computation
  baseline_type: 'mean'    # Baseline type: zero, random, mean

# Device Configuration
device: 'cuda:0'

# Output Configuration
output:
  dir: './outputs'
  experiment_name: ''  # Auto-generated if empty
