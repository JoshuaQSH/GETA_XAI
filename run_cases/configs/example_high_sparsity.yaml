# Example: High Sparsity XAI-GETA Experiment
# ==========================================
# Experiment with higher sparsity and layer_conductance attribution

# Dataset Configuration
dataset:
  root: '../datasets'
  batch_size: 128  # Larger batch size for faster training
  num_workers: 4

# Training Configuration
training:
  epochs: 100       # Shorter training
  lr: 2.0e-3        # Higher learning rate
  lr_quant: 1.0e-3
  weight_decay: 5.0e-5
  lr_step_size: 30
  lr_gamma: 0.1

# GETA/Quantization Configuration
geta:
  target_sparsity: 0.8  # Higher sparsity (80%)
  bit_reduction: 2
  min_bit: 4
  max_bit: 8   # Lower max bit for more aggressive quantization
  exponential_t: 1.0

# Stage Configuration (in epochs)
stages:
  projection_periods: 5
  projection_epochs: 15
  pruning_periods: 8
  pruning_epochs: 25

# XAI-GETA Specific Configuration
xai:
  attribution_method: 'layer_conductance'  # More informative attribution
  attribution_weight: 0.5   # Higher weight for attribution scores
  attribution_freq: 50      # More frequent updates
  attribution_n_steps: 10
  ema_decay: 0.95
  num_samples: 20
  baseline_type: 'zero'

# Device Configuration
device: 'cuda:0'

# Output Configuration
output:
  dir: './outputs/high_sparsity_exp'
  experiment_name: 'high_sparsity_layer_conductance'
