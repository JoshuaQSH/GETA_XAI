# BERT SQuAD XAI-GETA Experiment Configuration
# =============================================
# BERT SQuAD with XAI-GETA optimizer using attribution-based importance scoring

# Dataset Configuration
dataset:
  root: '../datasets'
  batch_size: 16
  num_workers: 4

# Training Configuration
training:
  epochs: 3
  lr: 3.0e-5
  lr_quant: 3.0e-5
  weight_decay: 0.01
  lr_step_size: 5
  lr_gamma: 0.1

# GETA/Quantization Configuration
geta:
  target_sparsity: 0.1
  bit_reduction: 2
  min_bit: 4
  max_bit: 8
  exponential_t: 1.0

# Stage Configuration (in epochs)
stages:
  start_projection_step: 0
  projection_periods: 4
  projection_epochs: 1
  pruning_periods: 6
  pruning_epochs: 6

# XAI-GETA Specific Configuration
xai:
  attribution_method: 'saliency'
  attribution_weight: 0.3
  attribution_freq: 100
  attribution_n_steps: 5
  ema_decay: 0.9999
  num_samples: 10
  baseline_type: 'mean'

# Device Configuration
device: 'cuda:0'

# Output Configuration
output:
  dir: './outputs'
  experiment_name: ''
